[package]
name = "OricoBridge"
version = "0.1.0"
edition = "2024"
authors = ["leyrshroud"]
description = "Print to Bluetooth PeriPage-protocol thermal printers (Orico A41 and others) from Windows"
license = "MIT"
repository = "https://github.com/leyrshroud/oricobridge"

[dependencies]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
